<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siva Talks - Solo Podcasts</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --champagne-gold: #C89B3C;
            --metallic-bronze: #8B5E1A;
            --dark-brown: #35271A;
            --soft-ivory: #F8F4EC;
            --cream-white: #FFFDF8;
            --warm-neutral: #E6E2D8;
            --text-dark: #2C241E;
        }

        body {
            font-family: 'Optima', 'Candara', 'Segoe UI', sans-serif;
            background-color: var(--warm-neutral);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* Mobile Container */
        .phone-container {
            width: 100%;
            max-width: 375px;
            height: 812px;
            background-color: var(--soft-ivory);
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(53, 39, 26, 0.25);
            position: relative;
            display: flex;
            flex-direction: column;
            border: 10px solid var(--dark-brown);
        }

        /* Header Section */
        .profile-header {
            width: 100%;
            height: 40%;
            background-color: #ffffff;
            /* Reference to your specific filename */
            background-image: url('logo.jpeg'); 
            background-size: cover;
            background-position: center;
            position: relative;
            flex-shrink: 0;
            border-bottom: 3px solid var(--champagne-gold);
        }

        /* Name Tag Overlay */
        .info-box {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(53, 39, 26, 0.9), transparent);
            color: white;
            padding: 40px 20px 15px 20px;
            z-index: 2;
        }

        .info-box h1 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 0.5px;
            font-weight: 600;
            color: var(--cream-white);
        }

        .info-box p {
            margin: 5px 0 0 0;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 400;
            color: var(--champagne-gold);
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px 0;
            background-color: var(--soft-ivory);
        }

        .btn-circle {
            width: 45px;
            height: 45px;
            background-color: var(--cream-white);
            color: var(--metallic-bronze);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 18px;
            transition: all 0.3s ease;
            border: 1px solid var(--champagne-gold);
            box-shadow: 0 4px 10px rgba(139, 94, 26, 0.1);
        }

        .btn-circle:hover {
            background-color: var(--metallic-bronze);
            color: var(--cream-white);
            transform: translateY(-3px);
        }

        /* Scrollable Content Area */
        .scroll-area {
            flex-grow: 1;
            overflow-y: auto;
            padding: 5px 20px 80px 20px;
            scrollbar-width: none;
        }

        .scroll-area::-webkit-scrollbar {
            display: none;
        }

        .section-title {
            color: var(--metallic-bronze);
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin: 20px 0 12px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--warm-neutral);
            padding-bottom: 5px;
        }

        /* Card Styling */
        .podcast-card {
            background-color: var(--cream-white);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-dark);
            transition: all 0.2s ease;
            border: 1px solid rgba(200, 155, 60, 0.15);
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .podcast-card:hover {
            background-color: #fff;
            transform: scale(1.01);
            border-color: var(--champagne-gold);
        }

        .play-icon {
            font-size: 20px;
            color: var(--metallic-bronze);
            margin-right: 15px;
            background: var(--soft-ivory);
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
        }

        .link-text {
            flex-grow: 1;
        }

        .link-text .title {
            font-weight: 600;
            font-size: 14px;
            display: block;
            margin-bottom: 2px;
            color: var(--dark-brown);
        }

        .link-text .duration {
            font-size: 11px;
            color: #8B7E74;
        }

        /* Footer */
        .footer-logo {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: var(--dark-brown);
            text-align: center;
            padding: 15px 0;
            font-size: 10px;
            color: var(--warm-neutral);
            letter-spacing: 1px;
        }
    </style>
</head>
