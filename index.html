<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পড়াশোনা.online - পারতে পারার আনন্দ</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for WhatsApp Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* ব্যাকগ্রাউন্ড কালার আরও লাইট করা হয়েছে */
            --light-mint: #f2fbf9;      
            --medium-mint: #6ccd9c;     
            --deep-teal: #3da990;       
            --bright-green: #3caf2a;    
            --lime-green: #7ebd2e;      
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: var(--light-mint);
            color: var(--deep-teal);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
        }

        /* Header Styling */
        header {
            width: 100%;
            padding: 25px 20px 5px 20px; /* নিচের প্যাডিং কমানো হয়েছে */
            text-align: center;
        }

        .brand-name {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--deep-teal);
            margin-bottom: 2px;
        }

        .brand-subtext {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--deep-teal);
            opacity: 0.8;
        }

        /* Main Content */
        main {
            width: 100%;
            max-width: 650px; /* ইমেজের উইডথ কমানো হয়েছে */
            padding: 10px 20px 20px 20px; /* টপ প্যাডিং কমানো হয়েছে */
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .infographic-container {
            width: 100%;
            background-color: #ffffff; /* ইমেজটি ফুটে ওঠার জন্য সাদা ব্যাকগ্রাউন্ড */
            padding: 8px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(61, 169, 144, 0.1);
            margin-bottom: 25px;
            border: 1px solid rgba(108, 205, 156, 0.2);
        }

        .infographic-container img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
        }

        /* Button Styling */
        .cta-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bright-green);
            color: white;
            padding: 16px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(60, 175, 42, 0.25);
            margin-bottom: 40px;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            background-color: var(--deep-teal);
            box-shadow: 0 10px 20px rgba(61, 169, 144, 0.3);
        }

        .cta-button i {
            font-size: 1.4rem;
            margin-right: 10px;
        }

        .divider {
            width: 40px;
            height: 3px;
            background-color: var(--lime-green);
            margin: 10px auto;
            border-radius: 2px;
            opacity: 0.6;
        }

        /* Mobile Optimization */
        @media (max-width: 600px) {
            .brand-name {
                font-size: 1.7rem;
            }
            main {
                max-width: 100%;
                padding: 5px 15px;
            }
            .cta-button {
                width: 100%;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-name">পড়াশোনা.online</div>
        <div class="brand-subtext">শিব প্রসাদ মুখার্জি</div>
        <div class="divider"></div>
    </header>

    <main>
        <!-- Infographic Section -->
        <div class="infographic-container">
            <!-- এখানে আপনার ছবির ফাইল নাম দিন -->
            <img src="parte-parar-anondo.png" alt="পারতে পারার আনন্দ">
        </div>

        <!-- WhatsApp Button -->
        <a href="YOUR_WHATSAPP_LINK_HERE" class="cta-button">
            <i class="fab fa-whatsapp"></i> হোয়াটসঅ্যাপ চ্যানেলে যুক্ত হন
        </a>
    </main>

    <footer style="padding-bottom: 20px; font-size: 0.85rem; opacity: 0.6; color: var(--deep-teal);">
        &copy; ২০২৬ পড়াশোনা.online
    </footer>

</body>
</html>
